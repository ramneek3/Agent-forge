# Render Blueprint for the AgentForge API (free tier). The frontend is on Vercel.
# Dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: agentforge-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      # SQLite on the instance disk: resets when the free instance restarts,
      # so a demo agent and knowledge doc are seeded on every boot.
      - key: USE_SQLITE
        value: "true"
      - key: SEED_DEMO
        value: "true"
      - key: USE_LOCAL_EMBEDDINGS
        value: "false"
      # Providers with a key make real calls; the rest fall back to named mocks.
      - key: LLM_MOCK_MODE
        value: "false"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: CORS_ORIGIN_REGEX
        value: https://agentforge(-[a-z0-9-]+)?\.vercel\.app
